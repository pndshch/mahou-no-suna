<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>まほうの砂 — Magic Sand</title>
<meta name="description" content="砂・水・火・植物を注いで、ふしぎな世界をつくろう！3〜7歳向け粒子シミュレーター。">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Helvetica Neue', sans-serif; }

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
}

#toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 12px;
  background: #16213e;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.elem-btn {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  border: 3px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  font-size: 22px;
  position: relative;
}
.elem-btn:active { transform: scale(0.92); }
.elem-btn.active {
  border-color: #fff;
  box-shadow: 0 0 16px rgba(255,255,255,0.4);
  transform: scale(1.08);
}
.elem-btn .label {
  font-size: 9px;
  color: #fff;
  font-weight: 700;
  margin-top: 2px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}

.btn-sand   { background: linear-gradient(135deg, #f4d03f, #c9920a); }
.btn-water  { background: linear-gradient(135deg, #3498db, #1a5276); }
.btn-fire   { background: linear-gradient(135deg, #e74c3c, #f39c12); }
.btn-wood   { background: linear-gradient(135deg, #6d4c22, #8b5e3c); }
.btn-plant  { background: linear-gradient(135deg, #27ae60, #145a32); }
.btn-stone  { background: linear-gradient(135deg, #7f8c8d, #515a5a); }
.btn-oil    { background: linear-gradient(135deg, #2c3e50, #1a252f); }
.btn-erase  { background: linear-gradient(135deg, #9b59b6, #6c3483); }

#clear-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #e74c3c;
  border: 2px solid #c0392b;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
  transition: transform 0.15s;
}
#clear-btn:active { transform: scale(0.9); }

#canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#size-slider {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 28px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(22,33,62,0.85);
  border-radius: 14px;
  outline: none;
  border: 1px solid #0f3460;
}
#size-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

#fps {
  position: absolute;
  top: 4px;
  right: 8px;
  font-size: 10px;
  color: rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button class="elem-btn btn-sand active" data-elem="sand"><span>🏖️</span><span class="label">すな</span></button>
    <button class="elem-btn btn-water" data-elem="water"><span>💧</span><span class="label">みず</span></button>
    <button class="elem-btn btn-fire" data-elem="fire"><span>🔥</span><span class="label">ひ</span></button>
    <button class="elem-btn btn-wood" data-elem="wood"><span>🪵</span><span class="label">き</span></button>
    <button class="elem-btn btn-plant" data-elem="plant"><span>🌱</span><span class="label">くさ</span></button>
    <button class="elem-btn btn-stone" data-elem="stone"><span>🪨</span><span class="label">いし</span></button>
    <button class="elem-btn btn-oil" data-elem="oil"><span>🛢️</span><span class="label">あぶら</span></button>
    <button class="elem-btn btn-erase" data-elem="erase"><span>✨</span><span class="label">けす</span></button>
    <button id="clear-btn" title="ぜんぶけす">🗑️</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <input type="range" id="size-slider" min="1" max="8" value="3">
    <div id="fps"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SCALE = 3;
let W, H;
let grid, nextGrid;

const EMPTY = 0, SAND = 1, WATER = 2, FIRE = 3, WOOD = 4, PLANT = 5, STONE = 6, OIL = 7, STEAM = 8;

const COLORS = {
  [SAND]:  ['#f4d03f','#d4ac0d','#b7950b','#f9e154','#e6c422'],
  [WATER]: ['#3498db','#2e86c1','#2471a3','#5dade2','#85c1e9'],
  [FIRE]:  ['#e74c3c','#f39c12','#f1c40f','#ff6b35','#ff4500'],
  [WOOD]:  ['#6d4c22','#8b5e3c','#5c3317','#7a4a2a','#9b6b3a'],
  [PLANT]: ['#27ae60','#2ecc71','#1e8449','#52be80','#76d7c4'],
  [STONE]: ['#7f8c8d','#95a5a6','#616a6b','#839192','#aab7b8'],
  [OIL]:   ['#2c3e50','#34495e','#1c2833','#283747','#212f3c'],
  [STEAM]: ['#d5dbdb','#eaeded','#f2f4f4','#cacfd2','#bfc9ca'],
};

let currentElem = SAND;
let brushSize = 3;
let painting = false;
let mouseX = -1, mouseY = -1;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  W = Math.floor(rect.width / SCALE);
  H = Math.floor(rect.height / SCALE);
  canvas.width = W;
  canvas.height = H;
  const newGrid = new Uint8Array(W * H);
  const newNext = new Uint8Array(W * H);
  if (grid) {
    const copyW = Math.min(W, grid._w || 0);
    const copyH = Math.min(H, grid._h || 0);
    for (let y = 0; y < copyH; y++) {
      for (let x = 0; x < copyW; x++) {
        newGrid[y * W + x] = grid[y * (grid._w || W) + x];
      }
    }
  }
  newGrid._w = W;
  newGrid._h = H;
  grid = newGrid;
  nextGrid = newNext;
  nextGrid._w = W;
  nextGrid._h = H;
}

function idx(x, y) { return y * W + x; }
function get(x, y) { return (x >= 0 && x < W && y >= 0 && y < H) ? grid[idx(x, y)] : STONE; }
function set(x, y, v) { if (x >= 0 && x < W && y >= 0 && y < H) nextGrid[idx(x, y)] = v; }

function update() {
  nextGrid.set(grid);

  for (let y = H - 1; y >= 0; y--) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const startX = dir === 1 ? 0 : W - 1;
    for (let i = 0; i < W; i++) {
      const x = startX + i * dir;
      const cell = grid[idx(x, y)];
      if (cell === EMPTY) continue;

      switch (cell) {
        case SAND: updateSand(x, y); break;
        case WATER: updateWater(x, y); break;
        case FIRE: updateFire(x, y); break;
        case OIL: updateOil(x, y); break;
        case PLANT: updatePlant(x, y); break;
        case STEAM: updateSteam(x, y); break;
      }
    }
  }

  const temp = grid;
  grid = nextGrid;
  grid._w = W;
  grid._h = H;
  nextGrid = temp;
  nextGrid._w = W;
  nextGrid._h = H;
}

function updateSand(x, y) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    set(x, y, EMPTY);
    set(x, y + 1, SAND);
  } else if (below === WATER || below === OIL) {
    set(x, y, below);
    set(x, y + 1, SAND);
  } else {
    const dl = get(x - 1, y + 1);
    const dr = get(x + 1, y + 1);
    if (dl === EMPTY || dl === WATER || dl === OIL) {
      set(x, y, dl === EMPTY ? EMPTY : dl);
      set(x - 1, y + 1, SAND);
    } else if (dr === EMPTY || dr === WATER || dr === OIL) {
      set(x, y, dr === EMPTY ? EMPTY : dr);
      set(x + 1, y + 1, SAND);
    }
  }
}

function updateWater(x, y) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    set(x, y, EMPTY);
    set(x, y + 1, WATER);
  } else if (below === OIL) {
    set(x, y, OIL);
    set(x, y + 1, WATER);
  } else {
    const dl = get(x - 1, y + 1);
    const dr = get(x + 1, y + 1);
    if (dl === EMPTY) {
      set(x, y, EMPTY);
      set(x - 1, y + 1, WATER);
    } else if (dr === EMPTY) {
      set(x, y, EMPTY);
      set(x + 1, y + 1, WATER);
    } else {
      const side = Math.random() < 0.5 ? -1 : 1;
      const sl = get(x + side, y);
      if (sl === EMPTY) {
        set(x, y, EMPTY);
        set(x + side, y, WATER);
      } else if (get(x - side, y) === EMPTY) {
        set(x, y, EMPTY);
        set(x - side, y, WATER);
      }
    }
  }
}

function updateFire(x, y) {
  if (Math.random() < 0.08) {
    set(x, y, EMPTY);
    return;
  }
  if (Math.random() < 0.3) {
    const above = get(x, y - 1);
    if (above === EMPTY) {
      set(x, y, EMPTY);
      set(x, y - 1, FIRE);
    }
  }
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      const n = get(x + dx, y + dy);
      if (n === WOOD || n === PLANT || n === OIL) {
        if (Math.random() < (n === OIL ? 0.4 : 0.06)) {
          set(x + dx, y + dy, FIRE);
        }
      }
      if (n === WATER) {
        if (Math.random() < 0.15) {
          set(x, y, STEAM);
          set(x + dx, y + dy, EMPTY);
          return;
        }
      }
    }
  }
}

function updateOil(x, y) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    set(x, y, EMPTY);
    set(x, y + 1, OIL);
  } else {
    const dl = get(x - 1, y + 1);
    const dr = get(x + 1, y + 1);
    if (dl === EMPTY) {
      set(x, y, EMPTY);
      set(x - 1, y + 1, OIL);
    } else if (dr === EMPTY) {
      set(x, y, EMPTY);
      set(x + 1, y + 1, OIL);
    } else {
      const side = Math.random() < 0.5 ? -1 : 1;
      if (get(x + side, y) === EMPTY) {
        set(x, y, EMPTY);
        set(x + side, y, OIL);
      } else if (get(x - side, y) === EMPTY) {
        set(x, y, EMPTY);
        set(x - side, y, OIL);
      }
    }
  }
}

function updatePlant(x, y) {
  if (Math.random() < 0.01) {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        if (get(x + dx, y + dy) === WATER) {
          const growDir = [[-1,-1],[0,-1],[1,-1],[-1,0],[1,0]][Math.floor(Math.random()*5)];
          const gx = x + growDir[0], gy = y + growDir[1];
          if (get(gx, gy) === EMPTY) {
            set(gx, gy, PLANT);
            set(x + dx, y + dy, EMPTY);
          }
          return;
        }
      }
    }
  }
}

function updateSteam(x, y) {
  if (Math.random() < 0.02) {
    set(x, y, WATER);
    return;
  }
  const above = get(x, y - 1);
  if (above === EMPTY) {
    set(x, y, EMPTY);
    set(x, y - 1, STEAM);
  } else {
    const side = Math.random() < 0.5 ? -1 : 1;
    if (get(x + side, y - 1) === EMPTY) {
      set(x, y, EMPTY);
      set(x + side, y - 1, STEAM);
    } else if (get(x + side, y) === EMPTY) {
      set(x, y, EMPTY);
      set(x + side, y, STEAM);
    }
  }
}

const imageData = { data: null, obj: null };

function render() {
  if (!imageData.obj || imageData.obj.width !== W || imageData.obj.height !== H) {
    imageData.obj = ctx.createImageData(W, H);
    imageData.data = imageData.obj.data;
  }
  const data = imageData.data;

  for (let i = 0; i < W * H; i++) {
    const cell = grid[i];
    const pi = i * 4;
    if (cell === EMPTY) {
      data[pi] = 26; data[pi+1] = 26; data[pi+2] = 46; data[pi+3] = 255;
    } else {
      const colors = COLORS[cell];
      const hex = colors[(i * 7 + (cell === FIRE || cell === STEAM ? (Date.now() >> 5) : 0)) % colors.length];
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      data[pi] = r; data[pi+1] = g; data[pi+2] = b; data[pi+3] = 255;
    }
  }

  ctx.putImageData(imageData.obj, 0, 0);
}

function paint(cx, cy) {
  const elem = currentElem === 'erase' ? EMPTY : currentElem;
  const r = brushSize;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx*dx + dy*dy > r*r) continue;
      const px = cx + dx, py = cy + dy;
      if (px < 0 || px >= W || py < 0 || py >= H) continue;
      if (elem === EMPTY || grid[idx(px, py)] === EMPTY) {
        if (Math.random() < 0.6) {
          grid[idx(px, py)] = elem;
        }
      }
    }
  }
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return [
    Math.floor((clientX - rect.left) / rect.width * W),
    Math.floor((clientY - rect.top) / rect.height * H)
  ];
}

canvas.addEventListener('pointerdown', (e) => {
  painting = true;
  const [x, y] = getCanvasCoords(e);
  mouseX = x; mouseY = y;
  paint(x, y);
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!painting) return;
  const [x, y] = getCanvasCoords(e);
  const dx = x - mouseX, dy = y - mouseY;
  const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = Math.round(mouseX + dx * t);
    const py = Math.round(mouseY + dy * t);
    paint(px, py);
  }
  mouseX = x; mouseY = y;
});

canvas.addEventListener('pointerup', () => { painting = false; });
canvas.addEventListener('pointercancel', () => { painting = false; });

document.querySelectorAll('.elem-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.elem-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const elem = btn.dataset.elem;
    if (elem === 'erase') currentElem = 'erase';
    else if (elem === 'sand') currentElem = SAND;
    else if (elem === 'water') currentElem = WATER;
    else if (elem === 'fire') currentElem = FIRE;
    else if (elem === 'wood') currentElem = WOOD;
    else if (elem === 'plant') currentElem = PLANT;
    else if (elem === 'stone') currentElem = STONE;
    else if (elem === 'oil') currentElem = OIL;
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  grid.fill(0);
});

document.getElementById('size-slider').addEventListener('input', (e) => {
  brushSize = parseInt(e.target.value);
});

resize();
window.addEventListener('resize', resize);

let lastTime = 0;
let frameCount = 0;
const fpsEl = document.getElementById('fps');

function loop(time) {
  update();
  if (painting) paint(mouseX, mouseY);
  render();

  frameCount++;
  if (time - lastTime > 1000) {
    fpsEl.textContent = frameCount + ' fps';
    frameCount = 0;
    lastTime = time;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
